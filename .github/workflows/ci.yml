name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build backend
        run: |
          cd backend/RespiraLibere.Api
          dotnet restore
          dotnet build --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: |
          cd backend/RespiraLibere.Api
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run API and smoke test
        run: |
          cd backend/RespiraLibere.Api
          dotnet run --project RespiraLibere.Api.csproj --urls http://localhost:5001 --no-build &
          PID=$!
          # Czekaj aż serwer odpowie (max 30s, retry co 2s)
          for i in $(seq 1 15); do
            sleep 2
            curl -sf http://localhost:5001/health && break
          done
          curl --fail http://localhost:5001/swagger/index.html
          kill $PID || true
