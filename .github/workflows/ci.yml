name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build backend
        run: |
          cd backend/RespiraLibere.Api
          dotnet restore
          dotnet build --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Run API and smoke test
        run: |
          cd backend/RespiraLibere.Api
          dotnet run --project RespiraLibere.Api.csproj --urls http://localhost:5001 &
          PID=$!
          sleep 6
          curl --fail http://localhost:5001/swagger/index.html
          kill $PID || true
